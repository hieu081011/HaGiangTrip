<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16302B" />
    <title>Phượt Hà Giang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo" aria-hidden="true">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m3 20 6-11 4 7 3-4 5 8z" />
          </svg>
        </div>
        <div>
          <h1 id="tripTitle"></h1>
          <p id="tripSub"></p>
        </div>
      </header>

      <main>
        <section
          class="view active"
          id="mapView"
          aria-label="Bản đồ hành trình"
        >
          <div id="map"></div>
          <div
            class="chips"
            id="dayChips"
            role="toolbar"
            aria-label="Chọn ngày"
          ></div>
          <div class="fabs">
            <button
              class="fab"
              id="btnLocate"
              aria-label="Vị trí của tôi"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
              </svg>
            </button>
            <button
              class="fab"
              id="btnFit"
              aria-label="Xem toàn tuyến"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
              </svg>
            </button>
            <button
              class="fab"
              id="btnLayer"
              aria-label="Đổi kiểu bản đồ"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              >
                <path d="m12 3 9 5-9 5-9-5z" />
                <path d="m3 13 9 5 9-5" />
              </svg>
            </button>
          </div>
          <div class="toast" id="toast" role="status"></div>
          <div class="tray" id="tray">
            <div class="tray-head" id="trayHead"></div>
            <div class="stops" id="stops"></div>
          </div>
          <div
            class="sheet"
            id="sheet"
            role="dialog"
            aria-modal="false"
            aria-labelledby="sheetTitle"
          >
            <div class="grab" aria-hidden="true"></div>
            <button
              class="x"
              id="sheetClose"
              aria-label="Đóng"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
            <div class="sc" id="sheetBody"></div>
          </div>
        </section>

        <section
          class="view"
          id="scheduleView"
          aria-label="Lịch trình"
        >
          <div class="sch-days" id="schChips"></div>
          <div class="sch-wrap" id="schList"></div>
        </section>

        <section class="view" id="foodView" aria-label="Ăn uống">
          <div class="sch-days" id="foodChips"></div>
          <div class="sch-wrap" id="foodList"></div>
        </section>
      </main>

      <nav class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-view="mapView">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z" />
            <path d="M9 4v14M15 6v14" />
          </svg>
          <span>Bản đồ</span>
        </button>
        <button role="tab" aria-selected="false" data-view="scheduleView">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" />
          </svg>
          <span>Lịch trình</span>
        </button>
        <button role="tab" aria-selected="false" data-view="foodView">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10" />
            <path d="M17 3c-2 0-3 2-3 6h3v12" />
          </svg>
          <span>Ăn uống</span>
        </button>
      </nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/strings.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
